name: Google NDK Otomatik İndir ve Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Resmi Android NDK İndir ve Kur
        run: |
          echo "Google sunucularından Android NDK r23c indiriliyor..."
          wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          echo "Arşiv açılıyor..."
          unzip -q android-ndk-r23c-linux.zip
          mv android-ndk-r23c $HOME/android-ndk

      - name: Çalıştırma İzinlerini Ayarla
        run: |
          # Projenizdeki veya NDK'daki gerekli dosyalara yetki veriyoruz
          chmod +x ./ndk-build || true
          find . -name "*.sh" -exec chmod +x {} '+' || true

      - name: NDK Derlemesini Başlat (ndk-build)
        run: |
          # NDK yolunu PATH değişkenine ekleyip ndk-build komutunu tetikliyoruz
          export PATH=$PATH:$HOME/android-ndk
          
          # Projenizin kök dizininde ndk-build'i çalıştırıyoruz
          $HOME/android-ndk/ndk-build
          
      - name: Derlenen Çıktıları Kaydet (Artifacts)
        uses: upload-artifact@v4
        with:
          name: derlenmis-kutuphaneler
          path: |
            libs/
            obj/

name: Otomatik Android.mk Bul ve Build Yap

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Resmi Android NDK İndir ve Kur
        run: |
          echo "Google sunucularından Android NDK r23c indiriliyor..."
          wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          echo "Arşiv açılıyor..."
          unzip -q android-ndk-r23c-linux.zip
          mv android-ndk-r23c $HOME/android-ndk

      - name: Android.mk Dosyasını Bul ve Derlemeyi Başlat
        run: |
          export PATH=$PATH:$HOME/android-ndk
          
          # Proje klasöründe Android.mk dosyasını arıyoruz
          MK_FILE=$(find . -name "Android.mk" | head -n 1)
          
          if [ -z "$MK_FILE" ]; then
            echo "Hata: Projede hiçbir Android.mk dosyası bulunamadı!"
            exit 1
          fi
          
          echo "Bulunan Android.mk dosyası: $MK_FILE"
          
          # Android.mk dosyasının bulunduğu klasörü proje dizini (NDK_PROJECT_PATH) olarak belirliyoruz
          PROJECT_DIR=$(dirname "$(dirname "$MK_FILE")")
          
          # Eğer Android.mk doğrudan kök dizindeyse veya jni içindeyse:
          echo "Derleme başlatılıyor..."
          $HOME/android-ndk/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT="$MK_FILE"
          
      - name: Derlenen Çıktıları Kaydet (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: derlenmis-kutuphaneler
          path: |
            libs/
            obj/
